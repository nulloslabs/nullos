name: Build NullOS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rolling-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            binutils \
            build-essential \
            cpio \
            curl \
            gzip \
            tar \
            xorriso \
            xz-utils \
            zstd

      - name: Build ISO
        run: make iso

      - name: Name ISO
        id: build
        run: |
          short_sha="${GITHUB_SHA::7}"
          iso_name="nullos-${short_sha}.iso"
          cp iso/nullos.iso "$iso_name"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          echo "iso_name=$iso_name" >> "$GITHUB_OUTPUT"

      - name: Upload commit artifact
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.build.outputs.iso_name }}
          archive: false
          retention-days: 14

      - name: Update rolling release
        env:
          GH_TOKEN: ${{ github.token }}
          ISO_NAME: ${{ steps.build.outputs.iso_name }}
          SHORT_SHA: ${{ steps.build.outputs.short_sha }}
        run: |
          commit_timestamp="$(git show -s --format=%ct "$GITHUB_SHA")"
          release_datetime="$(date -u -d "@$commit_timestamp" +%Y%m%d-%H%M%S)"
          release_tag="rolling-$release_datetime-$SHORT_SHA"

          # Remove the legacy single rolling release and tag during migration.
          if gh release view rolling >/dev/null 2>&1; then
            gh release delete rolling --yes --cleanup-tag
          elif git ls-remote --exit-code --tags origin refs/tags/rolling >/dev/null 2>&1; then
            git push --delete origin rolling
          fi

          git tag --force "$release_tag" "$GITHUB_SHA"
          git push --force origin "refs/tags/$release_tag"

          notes="Automated NullOS build for commit [$GITHUB_SHA]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA)."

          # A manual rerun for the same commit replaces that commit's release.
          if gh release view "$release_tag" >/dev/null 2>&1; then
            gh release delete "$release_tag" --yes
          fi

          gh release create "$release_tag" "$ISO_NAME" \
            --title "NullOS ($SHORT_SHA)" \
            --notes "$notes" \
            --latest \
            --verify-tag

          # Keep only the three newest rolling releases, deleting their tags too.
          while IFS= read -r old_tag; do
            if [ -n "$old_tag" ]; then
              gh release delete "$old_tag" --yes --cleanup-tag
            fi
          done < <(
            gh release list --limit 100 --json tagName,createdAt --jq '
              map(select(.tagName | startswith("rolling-")))
              | sort_by(.createdAt)
              | reverse
              | .[3:][]
              | .tagName
            '
          )
